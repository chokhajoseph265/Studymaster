    <script>
      // Silence benign Vite HMR websocket notices in sandboxed cloud preview
      (function() {
        var origError = console.error;
        console.error = function() {
          var first = arguments[0];
          if (typeof first === 'string' && (first.includes('[vite]') || first.includes('vite-plugin-pwa'))) {
            return;
          }
          return origError.apply(console, arguments);
        };
        window.addEventListener('error', function(e) {
          if (e && e.message && (e.message.includes('[vite]') || e.message.includes('WebSocket'))) {
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
