<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="adminBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background Squircle / Rounded Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#adminBgGrad)" stroke="#1e293b" stroke-width="8" />

  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.25" stroke-dasharray="8 6" />

  <!-- Security Shield Container -->
  <path d="M 256 80 L 380 135 C 380 270 256 360 256 360 C 256 360 132 270 132 135 Z" fill="url(#shieldGrad)" />
  <path d="M 256 95 L 365 145 C 365 260 256 342 256 342 C 256 342 147 260 147 145 Z" fill="#0f172a" opacity="0.4" />

  <!-- Rising Sun Motif inside Shield -->
  <g transform="translate(256, 195)">
    <!-- Sun Rays -->
    <path d="M0 -55 L0 -75" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" />
    <path d="M-30 -45 L-45 -60" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" />
    <path d="M30 -45 L45 -60" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" />
    <path d="M-50 -20 L-70 -28" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" />
    <path d="M50 -20 L70 -28" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" />
    <!-- Sun Arc -->
    <path d="M -50 0 A 50 50 0 0 1 50 0 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Open Teacher/Examiner Syllabus Book -->
  <g fill="#ffffff">
    <!-- Left Page -->
    <path d="M 250 215 C 205 200 160 212 130 224 L 130 300 C 160 288 205 276 250 288 Z" fill="#f8fafc" />
    <!-- Right Page -->
    <path d="M 262 215 C 307 200 352 212 382 224 L 382 300 C 352 288 307 276 262 288 Z" fill="#e2e8f0" />
    <!-- Center Spine -->
    <rect x="250" y="215" width="12" height="78" rx="2" fill="#94a3b8" />
  </g>

  <!-- Admin Verification Checkmark / Key Emblem -->
  <g transform="translate(256, 400)">
    <circle cx="0" cy="0" r="32" fill="#10b981" />
    <path d="M-12 -2 L-4 8 L14 -10" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Bottom Label -->
  <text x="256" y="470" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="4">ADMIN SUITE</text>
</svg>
